<style>

    font-family: "Noto Serif TC", "Songti TC", "PMingLiU", serif; }
  h1 { font-size: 18px; font-weight: normal; text-align: center; margin: 20px 16px 4px; }
  p.note { font-size: 13px; color: #8a8174; text-align: center; margin: 0 16px 16px; }
  #grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; padding: 0 16px 24px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .cell svg { width: 96px; height: 96px; overflow: visible; }
  .cell svg path { fill: #2b2622; }
  .cell .font { font-size: 64px; line-height: 96px; height: 96px; color: #b3aa9c; }
  .pair { display: flex; gap: 8px; align-items: center; }
  .label { font-size: 12px; color: #a39a8c; }
  .wob { transform-origin: 50% 100%; animation: wob 1.6s ease-in-out infinite; }
  @keyframes wob { 0%,100% { transform: rotate(-2deg) scaleY(1); } 50% { transform: rotate(2deg) scaleY(0.96); } }

<body>
<h1>手寫風的字（左：自己畫的筆刷，右：電腦字型）</h1>
<p class="note">每一筆的位置跟走向用現成資料，筆畫的樣子用自己定的筆刷畫。</p>
<div id="controls">
  粗細 <input id="w" type="range" min="40" max="130" value="88">
  歪歪程度 <input id="j" type="range" min="0" max="40" value="14">
</div>
<div id="grid"></div>
<div id="credit">筆畫位置資料：<a href="https://github.com/skishore/makemeahanzi" target="_blank">Make Me a Hanzi</a>（來自文鼎 PL 字型，文鼎公眾授權書）</div>

<script>
// 每個字每一筆的「骨架線」，取自 Make Me a Hanzi 的 graphics.txt（medians），沒有修改
const MED = {"\u4eba":[[[483,736],[508,702],[511,678],[473,552],[408,416],[328,303],[271,244],[144,139],[72,95]],[[474,477],[477,459],[490,439],[571,333],[691,200],[753,145],[798,119],[986,90]]],"\u96de":[[[440,792],[380,802],[324,763],[189,706]],[[159,646],[212,606],[223,584]],[[303,696],[335,673],[351,652]],[[475,726],[487,697],[407,627]],[[283,618],[294,596],[293,578],[226,502],[219,476],[240,469],[272,470],[311,474],[321,482]],[[377,552],[387,520],[336,463],[244,380],[231,350],[256,350],[338,384],[380,397],[404,398]],[[397,435],[441,376]],[[71,213],[89,207],[134,208],[441,296],[484,304],[511,301]],[[290,345],[314,331],[322,318],[309,229],[279,150],[242,97],[208,65],[141,23]],[[364,198],[424,153],[447,116]],[[628,816],[651,796],[662,774],[638,713],[550,563],[512,511],[478,478]],[[569,548],[571,520],[585,497],[589,404],[582,179],[568,34],[574,-24]],[[721,710],[790,670],[810,640]],[[637,539],[688,534],[761,546],[888,579],[922,577]],[[660,418],[722,414],[847,443],[881,442]],[[653,305],[718,301],[845,327],[885,326]],[[721,516],[751,493],[758,459],[757,214],[741,192]],[[613,160],[622,151],[639,151],[895,183],[941,178],[973,167]]],"\u7c73":[[[269,663],[356,604],[378,564]],[[694,751],[715,729],[723,708],[693,674],[590,584]],[[164,435],[224,422],[485,455],[755,498],[823,485]],[[453,829],[481,807],[507,770],[498,277],[483,-45]],[[471,425],[363,275],[293,202],[223,142],[122,79]],[[524,431],[540,391],[581,339],[693,216],[751,166],[796,138],[954,117]]],"\u86cb":[[[250,709],[285,704],[634,760],[685,759],[713,732],[648,652]],[[469,709],[494,693],[502,676],[498,533],[513,508]],[[530,582],[544,594],[605,606],[641,608],[666,602]],[[304,639],[330,599],[287,511],[227,433],[183,392],[128,354]],[[362,562],[364,553],[496,489],[623,440],[741,404],[791,402],[920,424]],[[279,324],[305,307],[317,288],[359,151]],[[334,325],[353,314],[523,336],[595,352],[620,354],[642,348],[668,320],[638,255],[613,245]],[[376,172],[385,184],[610,214],[652,213],[670,204]],[[447,425],[493,387],[486,106],[470,84]],[[217,37],[274,13],[651,93],[670,90]],[[634,163],[743,45],[766,11],[777,-32]]],"\u706b":[[[216,534],[299,440],[316,391]],[[714,618],[736,593],[744,571],[696,522],[587,433]],[[436,773],[475,753],[497,733],[503,713],[488,443],[470,321],[456,275],[418,195],[368,138],[279,78],[174,36]],[[513,375],[521,341],[606,223],[689,127],[745,76],[768,60],[934,25]]],"\u6728":[[[228,534],[280,522],[695,584],[728,584],[766,574]],[[453,825],[506,771],[498,218],[486,-29]],[[474,519],[459,504],[447,460],[404,389],[332,297],[244,206],[179,154],[130,124]],[[528,513],[549,470],[641,344],[749,220],[789,200],[951,159]]],"\u6797":[[[109,490],[150,485],[193,490],[333,519],[369,533],[429,535]],[[263,792],[289,770],[312,739],[298,259],[283,104],[284,23]],[[279,478],[271,472],[255,404],[211,327],[141,228],[65,146]],[[328,412],[342,396],[385,371],[399,351]],[[481,529],[504,524],[557,526],[667,552],[765,585],[822,591],[835,586]],[[589,829],[642,775],[634,321],[619,-17]],[[606,508],[588,435],[540,356],[456,249],[390,182]],[[661,475],[674,439],[718,380],[829,253],[856,239],[985,205]]],"\u9b5a":[[[467,855],[490,809],[435,724],[350,643],[281,602]],[[463,717],[593,742],[629,738],[651,724],[637,697],[531,582],[497,561]],[[276,517],[306,495],[319,474],[375,245]],[[331,518],[357,508],[642,567],[692,570],[724,561],[753,524],[690,325],[670,280],[673,247]],[[407,406],[462,404],[548,425],[564,434],[599,440],[620,437]],[[484,517],[514,493],[513,324],[496,303]],[[394,254],[428,268],[613,297],[635,309]],[[157,192],[163,155],[161,109],[146,-2]],[[340,173],[397,113],[409,81]],[[537,190],[612,129],[627,104]],[[749,202],[868,110],[890,75],[903,28]]],"\u68ee":[[[298,689],[337,683],[385,685],[490,700],[646,734],[691,734]],[[460,845],[486,826],[501,805],[487,492],[493,445]],[[466,674],[441,623],[380,558],[305,503],[247,476]],[[523,683],[598,617],[700,551],[772,539],[856,539]],[[131,297],[189,291],[375,333],[417,338],[439,334]],[[288,426],[316,394],[321,340],[314,136],[303,25],[308,-31]],[[293,291],[285,284],[276,238],[216,154],[152,87],[73,30]],[[350,243],[358,227],[399,205],[416,184]],[[488,341],[544,336],[770,380],[812,384],[847,378]],[[609,476],[650,433],[642,-32]],[[619,323],[598,250],[545,178],[477,107],[416,66]],[[675,303],[682,278],[725,228],[845,113],[985,84]]],"\u6211":[[[458,627],[392,631],[336,588],[274,552],[258,550],[253,542],[220,530],[212,532],[203,522]],[[174,404],[215,398],[241,402],[672,514],[742,512]],[[323,556],[351,542],[365,522],[361,116],[340,67],[246,113]],[[100,206],[124,195],[163,189],[492,334]],[[492,807],[537,760],[538,627],[569,435],[612,299],[676,170],[717,112],[779,48],[817,22],[859,12],[880,78],[891,140],[886,147],[894,173]],[[723,412],[737,365],[664,259],[594,198],[489,142],[454,132]],[[657,710],[750,668],[781,634]]]};

// 讓每次畫出來的歪法都一樣（同一個字不會每次重整都長得不同）
function seeded(seed) { return () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }; }

// 把骨架的幾個點連成圓滑的線
function smooth(pts, per = 8) {
  const out = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || pts[i + 1];
    for (let k = 0; k < per; k++) {
      const t = k / per, t2 = t * t, t3 = t2 * t;
      out.push([0, 1].map(d => 0.5 * ((2 * p1[d]) + (-p0[d] + p2[d]) * t +
        (2 * p0[d] - 5 * p1[d] + 4 * p2[d] - p3[d]) * t2 + (-p0[d] + 3 * p1[d] - 3 * p2[d] + p3[d]) * t3)));
    }
  }
  out.push(pts[pts.length - 1]);
  return out;
}

// 依筆畫走向決定粗細變化：撇越寫越細、捺越寫越粗、點圓圓胖胖、其他中間稍微鼓
function profile(pts, W) {
  const a = pts[0], b = pts[pts.length - 1];
  const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy);
  if (len < 160) return t => W * (1.25 - 0.25 * t);                 // 點
  if (dx < -len * 0.3 && dy > len * 0.3) return t => W * (1.15 - 0.75 * t);   // 撇
  if (dx > len * 0.3 && dy > len * 0.3) return t => W * (0.6 + 0.65 * t);     // 捺
  return t => W * (0.85 + 0.25 * Math.sin(Math.PI * t));
}

// 一筆變成一個填滿的形狀：沿著骨架兩側往外推，頭尾補圓
function strokePath(med, W, J, rnd) {
  let pts = med.map(([x, y]) => [x + (rnd() - 0.5) * J, 900 - y + (rnd() - 0.5) * J]);
  pts = smooth(pts);
  const w = profile(pts, W), n = pts.length, L = [], R = [];
  for (let i = 0; i < n; i++) {
    const p = pts[i], q = pts[Math.min(n - 1, i + 1)], o = pts[Math.max(0, i - 1)];
    let nx = -(q[1] - o[1]), ny = q[0] - o[0]; const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
    const h = w(i / (n - 1)) / 2;
    L.push([p[0] + nx * h, p[1] + ny * h]); R.push([p[0] - nx * h, p[1] - ny * h]);
  }
  const r0 = w(0) / 2, r1 = w(1) / 2, s = pts[0], e = pts[n - 1];
  const f = v => v.map(c => c.toFixed(1)).join(' ');
  return 'M' + f(L[0]) + L.slice(1).map(p => 'L' + f(p)).join('') +
    `A${r1} ${r1} 0 0 1 ${f(R[n - 1])}` + R.slice(0, -1).reverse().map(p => 'L' + f(p)).join('') +
    `A${r0} ${r0} 0 0 1 ${f(L[0])}Z` +
    // 頭尾各補一顆圓，接縫才不會尖尖的
    `M${s[0] - r0} ${s[1]}a${r0} ${r0} 0 1 0 ${2 * r0} 0a${r0} ${r0} 0 1 0 ${-2 * r0} 0Z` +
    `M${e[0] - r1} ${e[1]}a${r1} ${r1} 0 1 0 ${2 * r1} 0a${r1} ${r1} 0 1 0 ${-2 * r1} 0Z`;
}

function render() {
  const W = +document.getElementById('w').value, J = +document.getElementById('j').value;
  const grid = document.getElementById('grid'); grid.innerHTML = '';
  Object.entries(MED).forEach(([ch, meds], ci) => {
    const rnd = seeded(ci * 31 + 7);
    // 筆畫多的字自動畫細一點，才不會糊成一團
    const Wc = W * Math.max(0.65, 1.1 - 0.022 * meds.length);
    const paths = meds.map(m => `<path d="${strokePath(m, Wc, J, rnd)}"/>`).join('');
    const cell = document.createElement('div'); cell.className = 'cell';
    cell.innerHTML = `<div class="pair"><svg viewBox="0 0 1024 1024"><g class="wob" style="animation-delay:-${ci * 0.37}s">${paths}</g></svg>
      <div class="font">${ch}</div></div><div class="label">${ch}</div>`;
    grid.appendChild(cell);
  });
}
document.getElementById('w').addEventListener('input', render);
document.getElementById('j').addEventListener('input', render);
render();
</script>
</body>
</html>
