<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>試做：雞</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #f7f4ec; color: #2b2622;
    font-family: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  #ji { position: absolute; left: 0; top: 0; width: 72px; height: 72px; cursor: pointer; display: block; }
  #ji svg { width: 100%; height: 100%; overflow: visible; }
  /* 筆畫外面再描一圈圓角的邊，看起來胖一點、圓一點 */
  #ji path { fill: #2b2622; stroke: #2b2622; stroke-width: 26; stroke-linejoin: round; stroke-linecap: round; }
  #ground { position: absolute; left: 0; right: 0; bottom: 0; height: 24px; border-top: 1px solid #d8d0c0; }
  #hint { position: absolute; left: 0; right: 0; top: 16px; text-align: center; font-size: 14px; color: #a39a8c; }
  @media (max-width: 520px) { #hint { top: 52px; } }
  #replay {
    position: absolute; right: 16px; top: 12px; font-size: 14px;
    background: none; border: 1px solid #cfc6b6; color: #8a8174;
    border-radius: 6px; padding: 4px 10px; cursor: pointer; font-family: inherit;
  }
  #credit { position: absolute; left: 12px; bottom: 3px; font-size: 11px; color: #b3aa9c; }
  #credit a { color: inherit; }
</style>
</head>
<body>
<div id="hint">點一下會拍翅膀</div>
<button id="replay">重新出現</button>
<div id="ground"></div>
<div id="ji"><svg viewBox="0 0 1024 1024"><g id="whole"></g></svg></div>
<div id="credit">筆畫資料：<a href="https://github.com/skishore/makemeahanzi" target="_blank">Make Me a Hanzi</a>（來自文鼎 PL 字型，文鼎公眾授權書）</div>

<script>
// 「雞」的筆畫資料，取自 Make Me a Hanzi 的 graphics.txt（文鼎公眾授權書，見 授權/ARPHICPL.TXT），沒有修改
const DATA = {"s":["M 339 805 Q 309 772 185 711 Q 181 702 185 700 Q 227 700 342 749 Q 370 767 430 780 Q 446 781 449 788 Q 452 798 441 807 Q 387 844 358 840 Q 351 836 351 827 Q 351 814 339 805 Z","M 168 620 Q 211 572 222 572 Q 229 572 234 581 Q 238 591 233 611 Q 229 632 167 653 Q 157 656 152 654 Q 148 653 149 643 Q 150 636 168 620 Z","M 297 687 Q 331 642 350 638 Q 360 637 365 650 Q 366 660 360 675 Q 344 700 301 707 Q 294 708 293 700 Q 292 694 297 687 Z","M 455 698 Q 446 685 402 631 Q 395 618 407 621 Q 416 624 485 663 Q 500 673 518 681 Q 534 688 527 702 Q 517 715 498 727 Q 480 737 471 736 Q 461 736 464 725 Q 465 712 455 698 Z","M 328 483 Q 283 484 247 483 Q 231 484 240 493 Q 279 535 314 565 Q 326 575 325 581 Q 325 591 301 616 Q 292 626 279 627 Q 272 626 274 615 Q 280 576 210 503 Q 203 499 195 492 Q 182 483 181 475 Q 182 462 192 448 Q 198 439 208 444 Q 230 454 302 465 Q 306 466 313 465 C 343 464 358 482 328 483 Z","M 313 360 Q 356 379 402 394 Q 403 395 407 395 C 436 403 427 416 398 409 Q 331 394 254 367 Q 253 366 253 368 Q 370 476 416 503 Q 426 509 424 518 Q 418 534 394 555 Q 382 564 375 563 Q 366 562 366 549 Q 363 528 328 483 L 313 465 Q 309 462 306 457 Q 210 363 190 355 Q 180 349 180 338 Q 180 328 199 311 Q 206 301 219 309 Q 250 331 283 347 L 313 360 Z","M 407 395 Q 425 365 438 361 Q 447 358 455 370 Q 458 379 454 395 Q 450 410 433 420 Q 409 439 397 445 Q 391 448 388 439 Q 387 433 398 409 L 407 395 Z","M 337 248 Q 413 270 507 288 Q 522 291 522 298 Q 523 310 506 318 Q 479 328 458 321 Q 397 303 347 289 L 290 273 Q 155 237 75 225 Q 62 224 60 215 Q 59 205 73 195 Q 112 171 149 186 Q 227 216 285 234 L 337 248 Z","M 285 234 Q 255 110 136 29 Q 124 22 135 19 Q 178 15 242 69 Q 303 120 332 222 Q 332 226 333 228 Q 334 238 337 248 L 347 289 Q 351 302 358 314 Q 365 330 352 337 Q 331 355 313 360 C 285 371 276 374 283 347 Q 289 332 290 273 L 285 234 Z","M 376 167 Q 401 142 427 111 Q 436 101 448 100 Q 457 99 461 109 Q 465 119 462 143 Q 458 171 377 204 Q 365 208 360 206 Q 356 205 356 194 Q 357 185 376 167 Z","M 568 558 Q 574 568 582 577 Q 622 628 666 707 Q 684 743 700 761 Q 709 771 703 784 Q 699 796 671 815 Q 644 831 627 829 Q 609 826 619 806 Q 641 764 565 627 Q 531 564 480 493 Q 471 483 470 477 Q 467 467 480 470 Q 501 476 540 523 L 568 558 Z","M 604 167 Q 604 414 613 476 Q 620 503 611 514 Q 592 535 579 549 Q 575 555 568 558 C 545 578 526 550 540 523 Q 570 474 570 384 Q 558 183 556 172 Q 532 37 533 34 Q 540 -15 561 -36 Q 579 -52 591 -25 Q 606 15 605 62 Q 604 102 604 139 L 604 167 Z","M 740 677 Q 762 658 786 635 Q 798 623 812 624 Q 821 625 825 636 Q 829 649 821 675 Q 812 702 735 718 Q 722 721 716 719 Q 712 715 713 704 Q 716 694 740 677 Z","M 752 525 Q 921 564 927 568 Q 934 575 931 582 Q 924 592 899 598 Q 877 604 782 573 Q 691 554 643 548 Q 612 542 635 528 Q 668 510 714 518 L 752 525 Z","M 782 408 Q 881 429 887 433 Q 894 440 890 447 Q 884 456 861 462 Q 840 465 783 447 L 733 435 Q 702 431 667 426 Q 637 422 658 407 Q 688 391 733 398 L 782 408 Z","M 779 293 Q 885 314 890 317 Q 897 324 894 331 Q 888 340 865 347 Q 850 350 780 332 L 734 322 Q 698 318 659 314 Q 631 310 651 295 Q 682 276 729 285 Q 730 286 734 285 L 779 293 Z","M 777 190 Q 778 245 779 293 L 780 332 Q 781 372 782 408 L 783 447 Q 786 496 782 502 Q 766 515 752 525 C 728 543 702 546 714 518 Q 726 494 733 435 L 733 398 Q 733 368 734 322 L 734 285 Q 734 242 735 184 C 735 154 776 160 777 190 Z","M 735 184 Q 674 177 604 167 C 574 163 576 151 604 139 Q 628 127 649 133 Q 739 155 961 155 Q 977 155 982 162 Q 986 172 973 184 Q 922 223 869 205 Q 830 199 777 190 L 735 184 Z"],"m":[[[440,792],[380,802],[324,763],[189,706]],[[159,646],[212,606],[223,584]],[[303,696],[335,673],[351,652]],[[475,726],[487,697],[407,627]],[[283,618],[294,596],[293,578],[226,502],[219,476],[240,469],[272,470],[311,474],[321,482]],[[377,552],[387,520],[336,463],[244,380],[231,350],[256,350],[338,384],[380,397],[404,398]],[[397,435],[441,376]],[[71,213],[89,207],[134,208],[441,296],[484,304],[511,301]],[[290,345],[314,331],[322,318],[309,229],[279,150],[242,97],[208,65],[141,23]],[[364,198],[424,153],[447,116]],[[628,816],[651,796],[662,774],[638,713],[550,563],[512,511],[478,478]],[[569,548],[571,520],[585,497],[589,404],[582,179],[568,34],[574,-24]],[[721,710],[790,670],[810,640]],[[637,539],[688,534],[761,546],[888,579],[922,577]],[[660,418],[722,414],[847,443],[881,442]],[[653,305],[718,301],[845,327],[885,326]],[[721,516],[751,493],[758,459],[757,214],[741,192]],[[613,160],[622,151],[639,151],[895,183],[941,178],[973,167]]]};

const NS = 'http://www.w3.org/2000/svg';
const ji = document.getElementById('ji');
const whole = document.getElementById('whole');
const SIZE = 72, GROUND = 24;

// 每一筆包一層 g，才能單獨移動、轉動；中心點用筆畫骨架的中間那點
const strokes = DATA.s.map((d, i) => {
  const g = document.createElementNS(NS, 'g');
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('d', d);
  p.setAttribute('transform', 'scale(1,-1) translate(0,-900)');
  g.appendChild(p); whole.appendChild(g);
  const m = DATA.m[i][Math.floor(DATA.m[i].length / 2)];
  const top = DATA.m[i][0];
  return { g, cx: m[0], cy: 900 - m[1], px: top[0], py: 900 - top[1], x: 0, y: 0, a: 0, vx: 0, vy: 0, va: 0, show: 0 };
});

const st = { puff: 0, x: 0, y: 0, vy: 0, mode: 'write', dir: 1, timer: 0, tilt: 0, squash: 0, writeT: 0 };
function floorY() { return innerHeight - GROUND - SIZE; }
function rand(a, b) { return a + Math.random() * (b - a); }

function pickNext() {
  const r = Math.random();
  if (r < 0.45) { st.mode = 'hop'; st.timer = rand(1.5, 4); if (Math.random() < 0.35) st.dir *= -1; }
  else if (r < 0.75) { st.mode = 'peck'; st.timer = rand(1, 2.5); }
  else { st.mode = 'idle'; st.timer = rand(0.8, 2); }
}

// 點一下：「隹」的橫筆（羽毛）往外蓬，翅膀拍幾下，字的骨架不動
const FEATHERS = [13, 14, 15, 17];
const HEAD = [0, 1, 2, 3];
const WING = [10, 11, 12, 13, 14, 15, 16, 17];
const WING_LIFT = -90, WING_PIVOT = [560, 430];   // 翅膀抬高多少、繞哪裡拍
function burst() {
  FEATHERS.forEach(i => {
    const s = strokes[i];
    const toRight = s.cx > 512 ? 1 : -1;
    s.vx += toRight * rand(800, 1200); s.vy += rand(-300, 50); s.va += toRight * rand(-120, 120);
  });
  st.squash = 0.22; st.puff = 1;
}

let hopPhase = 0, last = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  let bob = 0;

  if (st.mode === 'write') {
    // 整個字一起冒出來，彈一下
    st.writeT += dt;
    const t = Math.min(1, st.writeT / 0.35);
    const pop = t < 1 ? Math.sin(t * Math.PI * 0.75) / Math.sin(Math.PI * 0.75) : 1;
    strokes.forEach(s => { s.show = pop; });
    if (st.writeT > 0.8) { st.mode = 'idle'; st.timer = 0.6; }
  } else if (st.mode === 'hop') {
    // 雞走路一跳一跳
    hopPhase += dt * 7;
    bob = Math.abs(Math.sin(hopPhase)) * 14;
    st.x += st.dir * 55 * dt;
    st.tilt = -6;   // 往頭那邊前傾（下面的角度都以「頭朝左」來算，往右走時整隻鏡像翻過來）
    const max = innerWidth - SIZE;
    if (st.x < 0) { st.x = 0; st.dir = 1; }
    if (st.x > max) { st.x = max; st.dir = -1; }
    if ((st.timer -= dt) <= 0) { pickNext(); hopPhase = 0; }
  } else if (st.mode === 'peck') {
    // 啄地上
    const k = Math.max(0, Math.sin(now / 90));
    st.tilt = -(8 + k * 28);   // 頭那邊往下啄
    if ((st.timer -= dt) <= 0) pickNext();
  } else if (st.mode === 'idle') {
    st.tilt *= 0.9;
    bob = Math.sin(now / 160) * 1.2;
    if ((st.timer -= dt) <= 0) pickNext();
  }
  if (st.mode !== 'peck' && st.mode !== 'hop') st.tilt *= Math.pow(0.02, dt);

  // 身體部位：「大」的撇和點當兩條腳（只有腳著地）；
  // 「隹」整塊當翅膀，抬離地面，繞著靠身體那邊的接點拍；上面的「爫」當頭冠，走路一點一點
  const pose = strokes.map(() => ({ x: 0, y: 0, a: 0 }));
  let wing = 0;
  if (st.mode === 'hop') {
    const leg = Math.sin(hopPhase) * 14;
    pose[8].a = leg; pose[9].a = -leg;
    const nod = Math.cos(hopPhase) * 26;
    HEAD.forEach(i => pose[i].x = nod);
    wing = -4 + Math.sin(hopPhase * 2) * 4;
  } else if (st.mode === 'peck') {
    const k = Math.max(0, Math.sin(now / 90));
    HEAD.forEach(i => { pose[i].x = -k * 40; pose[i].y = k * 40; });
  }
  // 點一下：翅膀用力拍幾下，羽毛抖一抖
  st.puff *= Math.pow(0.15, dt);
  wing += -Math.abs(Math.sin(now / 55)) * 28 * st.puff;
  FEATHERS.forEach(i => pose[i].a += Math.sin(now / 35 + i) * 6 * st.puff);

  // 每一筆像彈簧一樣被拉回原位
  strokes.forEach((s, i) => {
    s.vx += -s.x * 120 * dt; s.vy += -s.y * 120 * dt; s.va += -s.a * 120 * dt;
    const damp = Math.pow(0.02, dt);
    s.vx *= damp; s.vy *= damp; s.va *= damp;
    s.x += s.vx * dt; s.y += s.vy * dt; s.a += s.va * dt;
    const sc = s.show;
    s.g.setAttribute('transform',
      (WING.includes(i) ? `translate(0 ${WING_LIFT}) rotate(${wing} ${WING_PIVOT[0]} ${WING_PIVOT[1]}) ` : '') +
      `translate(${s.x + pose[i].x} ${s.y + pose[i].y}) rotate(${s.a + pose[i].a} ${s.px} ${s.py}) translate(${s.cx} ${s.cy}) scale(${sc}) translate(${-s.cx} ${-s.cy})`);
    s.g.style.opacity = sc;
  });

  st.squash *= Math.pow(0.002, dt);
  st.y = floorY();
  ji.style.transformOrigin = '50% 100%';
  // 「雞」的頭（爫）在左邊，所以本來就是面朝左；往右走時左右翻過來，才不會倒著走
  const face = st.dir > 0 ? -1 : 1;
  ji.style.transform = `translate(${st.x}px, ${st.y - bob}px) rotate(${st.tilt * face}deg) scale(${(1 + st.squash) * face}, ${1 - st.squash})`;
  requestAnimationFrame(tick);
}

ji.addEventListener('pointerdown', () => { if (st.mode !== 'write') burst(); });
function rewrite() {
  strokes.forEach(s => { s.x = s.y = s.a = s.vx = s.vy = s.va = 0; s.show = 0; });
  st.mode = 'write'; st.writeT = 0; st.tilt = 0;
}
document.getElementById('replay').addEventListener('click', rewrite);
st.x = innerWidth / 2 - SIZE / 2; st.y = floorY();
addEventListener('resize', () => { st.x = Math.min(st.x, innerWidth - SIZE); });
requestAnimationFrame(tick);
</script>
</body>
</html>
